name: Sicherheit täglich

# Der volle CI-Lauf hängt an Push und Pull Request. Ohne Commit entsteht eine
# Lücke: Ein Paket, das heute sauber ist, kann morgen eine Meldung haben, und
# ein Geheimnis in einem alten Commit bleibt unbemerkt. Darum läuft diese
# Prüfung jeden Tag von selbst – bewusst schmal, nur Secret-Scan und
# Abhängigkeiten. Ein täglicher Lauf über zwanzig Minuten wird abgeschaltet.
#
# Wer die Meldung bekommt: Einen fehlgeschlagenen geplanten Lauf meldet GitHub
# der Person, die diese Datei angelegt oder die cron-Zeile zuletzt geändert
# hat. Öffentliche Repositories: GitHub schaltet geplante Workflows nach 60
# Tagen ohne Aktivität ab; gemergte Update-PRs halten sie am Leben.

on:
  schedule:
    # 06:23 UTC – in Zürich 08:23 im Sommer, 07:23 im Winter. Nicht zur vollen
    # Stunde, weil GitHub dann am meisten Last hat.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicherheit-taeglich
  cancel-in-progress: false

jobs:
  pruefung:
    name: Secret-Scan und Abhängigkeiten
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Die ganze Historie: Ein Geheimnis in einem alten Commit ist im
      # öffentlichen Repository weiter lesbar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ein flacher Checkout hätte genau einen Commit, und der Scan sähe grün
      # aus, ohne es zu sein.
      - name: Historie vollständig
        run: |
          count=$(git rev-list --count HEAD)
          echo "Commits im Checkout: $count"
          test "$count" -gt 1

      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Ausnahmen einzeln als GHSA-Nummer, nie als ganze Stufe, begründet in
      # docs/SECURITY.md. Fällt ein Befund weg, fällt sein --ignore weg.
      # GHSA-67mh-4wv8-2f99: esbuild über drizzle-kit, nur Entwicklungswerkzeug.
      # GHSA-vcc3-ghjq-m6fr: decode-uri-component über expo-router; die
      # behobene Fassung bricht query-string.
      - name: Bekannte Schwachstellen, blockierend ab moderat
        run: bun audit --audit-level=moderate --ignore GHSA-67mh-4wv8-2f99 --ignore GHSA-vcc3-ghjq-m6fr

      # Zur Ansicht in der Laufzusammenfassung, auch die ausgenommenen Nummern.
      - name: Alle Befunde zur Ansicht
        if: always()
        run: |
          {
            echo '### bun audit, alle Stufen'
            echo ''
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
