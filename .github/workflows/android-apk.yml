name: Android-APK

# Baut die Android-App ohne EAS: expo prebuild, dann Gradle. Bei einem Tag v*
# signiert mit dem Keystore aus den Secrets und hängt die APK an ein Release.
# Von Hand gestartet (workflow_dispatch) entsteht eine Probe-APK mit dem
# Debug-Schlüssel der Vorlage, nur als Artefakt – zum Prüfen, nie zum Verteilen.
# Beide Wege prüfen die Berechtigungen der fertigen APK gegen
# scripts/android-permissions.txt. Gebaut wird nur für ARM – echte Handys;
# x86 bräuchten nur Emulatoren.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  apk:
    name: APK bauen und Berechtigungen prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # nur für den Release-Anhang bei Tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Ohne Gradle-Cache: Die Gradle-Dateien entstehen erst mit expo prebuild.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - run: bun install --frozen-lockfile

      - name: Natives Android-Projekt erzeugen
        run: bunx expo prebuild --platform android --no-install --clean

      # Nur bei Tags: Ohne Keystore gibt es kein Release.
      - name: Keystore aus den Secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt – siehe docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Die Signatur geht als Gradle-Parameter hinein; die erzeugten nativen
      # Dateien bleiben unverändert.
      - name: Release-APK bauen (signiert)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Probe-APK bauen (Debug-Schlüssel der Vorlage)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Berechtigungen der fertigen APK prüfen
        run: node scripts/apk-permissions.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/hundebuechli-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: hundebuechli-apk
          path: out/*.apk
          retention-days: 14

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Hundebüechli $GITHUB_REF_NAME" \
              --notes "Android-APK, signiert. Installation und Prüfung: docs/RELEASE.md."
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
